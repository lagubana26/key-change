<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Key Change</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f0d1a">
<style>
:root{
  --bg:#0f0d1a;--tx:#f4f1ff;--ac:#8b5cf6;--on:#fff;
  --s1:color-mix(in srgb,var(--bg),var(--tx) 7%);
  --s2:color-mix(in srgb,var(--bg),var(--tx) 14%);
  --ln:color-mix(in srgb,var(--bg),var(--tx) 20%);
  --mut:color-mix(in srgb,var(--tx),var(--bg) 40%);
  --chord:color-mix(in srgb,var(--ac) 55%,var(--tx));
  --grad:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#ec4899));
  --glow:color-mix(in srgb,var(--ac),transparent 65%);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:640px;padding:16px 16px 40px;background:radial-gradient(600px 300px at 80% -80px,var(--glow),transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
h1{font-size:24px;margin:0;letter-spacing:-.5px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
button,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--s2);transition:transform .1s,opacity .2s}
button:active{transform:scale(.96)}
.pri{background:var(--grad);color:var(--on);box-shadow:0 6px 18px var(--glow)}
.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.danger{background:transparent;color:var(--mut);border:1px solid var(--ln)}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;background:transparent;color:var(--mut)}
.seg button.on{background:var(--grad);color:var(--on);box-shadow:0 4px 14px var(--glow)}
input,textarea{width:100%;margin-bottom:10px;padding:12px 14px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;outline:none}
input:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace}
::placeholder{color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.t{font-weight:700;font-size:17px}
.badge{display:inline-block;background:var(--s2);color:var(--tx);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}
.keybox{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:14px;padding:8px;margin-top:12px}
.keyv{text-align:center}
.keyv b{font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.7;margin:12px 0 0;overflow-x:auto}
.ch{color:var(--chord);font-weight:700}
.msg{min-height:20px;font-size:14px;color:var(--chord);margin:0 0 4px;text-align:center}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty div{font-size:44px;margin-bottom:8px}
.pick{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-weight:600}
.pick input{width:64px;height:44px;padding:2px;margin:0;border-radius:12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--s1);font-size:14px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ln)}
.hide{display:none}
</style>
</head>
<body>
<div class="top">
  <h1>🎵 <span>Key Change</span></h1>
  <button class="sm" id="share">Share app</button>
</div>
<div class="seg">
  <button id="t1" class="on">Page <span id="cnt"></span></button>
  <button id="t2">Library</button>
  <button id="t3">Colors</button>
</div>
<div class="msg" id="msg"></div>

<div id="v1"><div id="page"></div></div>

<div id="v3" class="hide">
  <div class="card">
    <div class="t">Your colors</div>
    <div class="mut">Pick the colors you like. They save automatically on your phone.</div>
    <div class="pick"><label for="cbg">Background</label><input type="color" id="cbg"></div>
    <div class="pick"><label for="ctx">Text</label><input type="color" id="ctx"></div>
    <div class="pick"><label for="cac">Buttons &amp; chords</label><input type="color" id="cac"></div>
    <div class="mut" style="margin:18px 0 8px">Quick themes</div>
    <div class="chips" id="presets"></div>
    <button class="sm danger" id="reset" style="margin-top:16px">Reset colors</button>
  </div>
</div>

<div id="v2" class="hide">
  <div class="card">
    <input id="ti" placeholder="Song title">
    <input id="ar" placeholder="Artist">
    <input id="ky" placeholder="Original key (e.g. G or Em) - optional">
    <textarea id="ch" placeholder="Chords / lyrics (e.g. C G Am F)"></textarea>
    <button id="save" class="pri" style="width:100%">Save song</button>
    <div class="mut" id="lib-count" style="margin-top:8px;text-align:center"></div>
  </div>
  <input id="q" placeholder="Search title or artist">
  <div id="results"></div>
</div>

<script>
const MAX_LIB=200, MAX_PAGE=5;
let lib=[], pageIds=[], shifts={};
try{lib=JSON.parse(localStorage.getItem("kc_lib")||"[]");pageIds=JSON.parse(localStorage.getItem("kc_page")||"[]");shifts=JSON.parse(localStorage.getItem("kc_shifts")||"{}")}catch(e){}
function persist(){try{localStorage.setItem("kc_lib",JSON.stringify(lib));localStorage.setItem("kc_page",JSON.stringify(pageIds));localStorage.setItem("kc_shifts",JSON.stringify(shifts))}catch(e){}}
const $=id=>document.getElementById(id);
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
function say(t){$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},3500)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function idx(n){let i=SH.indexOf(n);return i>=0?i:FL.indexOf(n)}
function tr(root,n,flat){let i=(idx(root)+n+120)%12;return (flat?FL:SH)[i]}
const SUF=/^(?:maj|min|m|M|dim|aug|sus|add|\d+|[#b+\-()])*$/;
function parse(tok){const m=tok.match(/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/);return m&&SUF.test(m[2])?m:null}
function transpose(text,n){
  if(!n)return text;
  return text.replace(/\S+/g,tok=>{
    const m=parse(tok);if(!m)return tok;
    const flat=m[1].includes("b")||(m[3]||"").includes("b");
    return tr(m[1],n,flat)+m[2]+(m[3]?"/"+tr(m[3],n,flat):"");
  });
}
function paint(text){return text.replace(/\S+/g,tok=>parse(tok)?`<span class="ch">${esc(tok)}</span>`:esc(tok))}
function baseKey(s){
  if(s.key)return s.key.trim();
  const t=(s.chords.match(/\S+/g)||[]).find(x=>parse(x));
  if(!t)return "";
  const m=t.match(/^([A-G][#b]?)(m(?!aj)|min)?/);
  return m?m[1]+(m[2]?"m":""):"";
}
function keyNow(s,n){const b=baseKey(s);return b?transpose(b,n):"?"}

function show(tab){
  [1,2,3].forEach(i=>{$("v"+i).classList.toggle("hide",tab!==i);$("t"+i).classList.toggle("on",tab===i)});
}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);$("t3").onclick=()=>show(3);

$("save").onclick=()=>{
  const t=$("ti").value.trim(),a=$("ar").value.trim(),c=$("ch").value;
  if(!t||!a){say("Enter both a title and an artist.");return}
  if(lib.length>=MAX_LIB){say("Library is full (200 songs). Delete one first.");return}
  if(lib.some(s=>norm(s.title)===norm(t)&&norm(s.artist)===norm(a))){say("That song by that artist is already saved.");return}
  lib.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:t,artist:a,key:$("ky").value.trim(),chords:c});
  $("ti").value=$("ar").value=$("ch").value=$("ky").value="";
  persist();say("Saved!");render();
};
$("q").oninput=render;

function addToPage(id){
  if(pageIds.includes(id))return;
  if(pageIds.length>=MAX_PAGE){say("Page is full (5 songs). Remove one first.");return}
  pageIds.push(id);shifts[id]=0;persist();say("Added to page.");render();
}
function removeFromPage(id){pageIds=pageIds.filter(x=>x!==id);persist();render()}
function del(id){
  if(!confirm("Delete this song?"))return;
  lib=lib.filter(s=>s.id!==id);pageIds=pageIds.filter(x=>x!==id);delete shifts[id];persist();render();
}
function shift(id,d){shifts[id]=(((shifts[id]||0)+d)%12+12)%12;if(shifts[id]>6)shifts[id]-=12;persist();render()}

$("share").onclick=async()=>{
  const url=location.href.split("#")[0],text="Try Key Change: save songs and change their chords to any key.";
  try{
    if(navigator.share){await navigator.share({title:"Key Change",text,url});return}
    await navigator.clipboard.writeText(url);say("Link copied. Paste it to your friends.");
  }catch(e){if(e&&e.name!=="AbortError")say("Copy this link: "+url)}
};

const DEF={bg:"#0f0d1a",tx:"#f4f1ff",ac:"#8b5cf6"};
const PRESETS=[
  {n:"Midnight",bg:"#0f0d1a",tx:"#f4f1ff",ac:"#8b5cf6"},
  {n:"Light",bg:"#f6f3ff",tx:"#1d1633",ac:"#7c3aed"},
  {n:"Black & white",bg:"#000000",tx:"#ffffff",ac:"#ffffff"},
  {n:"Ocean",bg:"#06202b",tx:"#e6f7ff",ac:"#22d3ee"},
  {n:"Forest",bg:"#0f1f17",tx:"#eafff2",ac:"#4ade80"},
  {n:"Sunset",bg:"#2a0f1a",tx:"#fff1ec",ac:"#fb923c"}
];
let theme={...DEF};
try{const t=JSON.parse(localStorage.getItem("kc_theme")||"null");if(t&&t.bg&&t.tx&&t.ac)theme=t}catch(e){}
function lum(h){const n=parseInt(h.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}
function applyTheme(){
  const r=document.documentElement.style;
  r.setProperty("--bg",theme.bg);r.setProperty("--tx",theme.tx);r.setProperty("--ac",theme.ac);
  r.setProperty("--on",lum(theme.ac)>0.6?"#111111":"#ffffff");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",theme.bg);
  $("cbg").value=theme.bg;$("ctx").value=theme.tx;$("cac").value=theme.ac;
}
function saveTheme(){
  try{localStorage.setItem("kc_theme",JSON.stringify(theme))}catch(e){}
  if(Math.abs(lum(theme.bg)-lum(theme.tx))<0.25)say("Text and background are too close. It may be hard to read.");else say("Colors saved.");
}
$("cbg").oninput=e=>{theme.bg=e.target.value;applyTheme();saveTheme()};
$("ctx").oninput=e=>{theme.tx=e.target.value;applyTheme();saveTheme()};
$("cac").oninput=e=>{theme.ac=e.target.value;applyTheme();saveTheme()};
$("reset").onclick=()=>{theme={...DEF};applyTheme();saveTheme()};
$("presets").innerHTML=PRESETS.map((p,i)=>`<button class="chip" data-p="${i}"><span class="dot" style="background:${p.bg};box-shadow:inset 0 0 0 5px ${p.ac}"></span>${esc(p.n)}</button>`).join("");
$("presets").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;const p=PRESETS[+b.dataset.p];theme={bg:p.bg,tx:p.tx,ac:p.ac};applyTheme();saveTheme()};
applyTheme();

function render(){
  $("cnt").textContent="("+pageIds.length+"/"+MAX_PAGE+")";
  $("lib-count").textContent=lib.length+" / "+MAX_LIB+" songs saved";
  const pg=pageIds.map(id=>lib.find(s=>s.id===id)).filter(Boolean);
  $("page").innerHTML=pg.length?pg.map(s=>{
    const n=shifts[s.id]||0;
    return `<div class="card"><div class="row"><div><div class="t">${esc(s.title)}</div><div class="mut">${esc(s.artist)}</div></div><button class="sm danger" data-rm="${s.id}">Remove</button></div>
    <div class="keybox"><button class="sm" data-d="-1" data-id="${s.id}">− Key</button><div class="keyv"><div class="mut">Key</div><b>${esc(keyNow(s,n))}</b><div class="mut">${n>0?"+":""}${n} semitones</div></div><button class="sm" data-d="1" data-id="${s.id}">+ Key</button></div>
    <pre>${paint(transpose(s.chords,n))}</pre></div>`}).join(""):`<div class="empty"><div>🎶</div>No songs on the page yet.<br>Open Library, search, and add up to 5.</div>`;
  const q=norm($("q").value);
  const found=lib.filter(s=>!q||norm(s.title).includes(q)||norm(s.artist).includes(q)).sort((a,b)=>a.title.localeCompare(b.title));
  $("results").innerHTML=found.length?found.map(s=>{
    const on=pageIds.includes(s.id),k=baseKey(s);
    return `<div class="card"><div class="row"><div><div class="t">${esc(s.title)}</div><div class="mut">${esc(s.artist)}${k?`<span class="badge">Key ${esc(k)}</span>`:""}</div></div>
    <div style="display:flex;gap:6px"><button class="sm ${on?"":"pri"}" data-add="${s.id}">${on?"On page":"Add"}</button><button class="sm danger" data-del="${s.id}">✕</button></div></div></div>`}).join(""):`<div class="empty"><div>🔍</div>No songs found.</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.add)addToPage(b.dataset.add);
  else if(b.dataset.del)del(b.dataset.del);
  else if(b.dataset.rm)removeFromPage(b.dataset.rm);
  else if(b.dataset.d)shift(b.dataset.id,+b.dataset.d);
});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
